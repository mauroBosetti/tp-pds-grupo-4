sonar.projectKey=tp-pds-grupo-4
sonar.projectName=TP PDS Grupo 4
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9000

# Fuentes de código de aplicación
sonar.sources=packages/api-vuelos/src,packages/ctv-backend/src,packages/ctv-frontend/src

# Fuentes de archivos de prueba
sonar.tests=packages/api-vuelos/features,packages/ctv-backend/src,packages/ctv-frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.steps.js,**/*.feature

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/prisma/migrations/**,**/coverage/**

sonar.sourceEncoding=UTF-8

# Rutas explícitas a cada lcov.info sin comodines
sonar.javascript.lcov.reportPaths=packages/api-vuelos/coverage/lcov.info,packages/ctv-backend/coverage/lcov.info,packages/ctv-frontend/coverage/lcov.info