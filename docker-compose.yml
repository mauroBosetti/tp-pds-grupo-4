services:
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    environment:
      - INFLUXDB_DB=k6
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
      
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6:/k6
    working_dir: /k6
    environment:
      - BASE_URL=http://ctv-backend:3000
      - VUELOS_URL=http://api-vuelos:4000
    depends_on:
      - ctv-backend
      - api-vuelos
  
  sonarqube: 
    image: sonarqube:community 
    ports: 
      - "9001:9000" 
    environment: 
      - SONAR-ES-BOOTSTRAP-CHECKS-DISABLE=true 
    volumes: 
      - sonarqube-data:/opt/sonarqube/data 
      - sonarqube-logs:/opt/sonarqube/logs 
      - sonarqube-extensions:/opt/sonarqube/extensions

  db-ctv:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ctv
      POSTGRES_PASSWORD: ctv
      POSTGRES_DB: ctv
    ports:
      - "5432:5432"
    volumes:
      - db-ctv-data:/var/lib/postgresql/data
    restart: unless-stopped

  db-vuelos:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: vuelos
      POSTGRES_PASSWORD: vuelos
      POSTGRES_DB: vuelos
    ports:
      - "5433:5432"
    volumes:
      - db-vuelos-data:/var/lib/postgresql/data
      - ./packages/api-vuelos/src/db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  db-vuelos-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vuelos_test
      POSTGRES_PASSWORD: vuelos_test
      POSTGRES_DB: vuelos_test
    ports:
      - "5434:5432"
    volumes:
      - db-vuelos-test-data:/var/lib/postgresql/data
    restart: unless-stopped

  ctv-backend:
    build:
      context: ./packages/ctv-backend
      args:
        - DATABASE_URL=postgresql://ctv:ctv@db-ctv:5432/ctv
    image: ctv-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ctv:ctv@db-ctv:5432/ctv
      API_VUELOS_URL: http://api-vuelos:4000
      ADMIN1_NOMBRE: "Admin Uno"
      ADMIN1_EMAIL: "admin1@ctv.com"
      ADMIN1_PASSWORD: "admin1234"
      ADMIN2_NOMBRE: "Admin Dos"
      ADMIN2_EMAIL: "admin2@ctv.com"
      ADMIN2_PASSWORD: "admin1234"
      ADMIN3_NOMBRE: "Admin Tres"
      ADMIN3_EMAIL: "admin3@ctv.com"
      ADMIN3_PASSWORD: "admin1234"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    depends_on:
      - db-ctv
      - api-vuelos

  ctv-frontend:
    build: ./packages/ctv-frontend
    image: ctv-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - ctv-backend

  api-vuelos:
    build:
      context: ./packages/api-vuelos
    image: api-vuelos
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://vuelos:vuelos@db-vuelos:5432/vuelos
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    depends_on:
      - db-vuelos

volumes:
  db-ctv-data:
  db-vuelos-data:
  db-vuelos-test-data:
  sonarqube-data: 
  sonarqube-logs: 
  sonarqube-extensions:
  grafana-data:
  alloy-data:
  loki-data:
  influxdb-data:
  prometheus-data:
