services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ctv
      POSTGRES_PASSWORD: ctv
      POSTGRES_DB: ctv
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  ctv-backend:
    build:
      context: ./packages/ctv-backend
      args:
        - DATABASE_URL=postgresql://ctv:ctv@db:5432/ctv
    image: ctv-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ctv:ctv@db:5432/ctv
    restart: unless-stopped
    depends_on:
      - db

  ctv-frontend:
    build: ./packages/ctv-frontend
    image: ctv-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - ctv-backend

volumes:
  db-data:
