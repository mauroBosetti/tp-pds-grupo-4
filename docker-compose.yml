services:
  db-ctv:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ctv
      POSTGRES_PASSWORD: ctv
      POSTGRES_DB: ctv
    ports:
      - "5432:5432"
    volumes:
      - db-ctv-data:/var/lib/postgresql/data
    restart: unless-stopped
  db-vuelos:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vuelos
      POSTGRES_PASSWORD: vuelos
      POSTGRES_DB: vuelos
    ports:
      - "5433:5432"
    volumes:
      - db-vuelos-data:/var/lib/postgresql/data
      - ./packages/API-vuelos/src/db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  ctv-backend:
    build:
      context: ./packages/ctv-backend
      args:
        - DATABASE_URL=postgresql://ctv:ctv@db-ctv:5432/ctv
    image: ctv-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ctv:ctv@db-ctv:5432/ctv
      ADMIN1_NOMBRE: "Admin Uno"
      ADMIN1_EMAIL: "admin1@ctv.com"
      ADMIN1_PASSWORD: "admin1234"
      ADMIN2_NOMBRE: "Admin Dos"
      ADMIN2_EMAIL: "admin2@ctv.com"
      ADMIN2_PASSWORD: "admin1234"
      ADMIN3_NOMBRE: "Admin Tres"
      ADMIN3_EMAIL: "admin3@ctv.com"
      ADMIN3_PASSWORD: "admin1234"
    restart: unless-stopped
    depends_on:
      - db-ctv

  ctv-frontend:
    build: ./packages/ctv-frontend
    image: ctv-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - ctv-backend

  api-vuelos:
    build:
      context: ./packages/api-vuelos
    image: api-vuelos
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://vuelos:vuelos@db-vuelos:5432/vuelos
    restart: unless-stopped
    depends_on:
      - db-vuelos

volumes:
  db-ctv-data:
  db-vuelos-data:
