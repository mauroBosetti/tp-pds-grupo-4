apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctv-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctv-frontend
  template:
    metadata:
      labels:
        app: ctv-frontend
    spec:
      containers:
        - name: ctv-frontend
          image: "{{ .Values.ctvFrontend.imagen.repositorio }}:{{ .Values.ctvFrontend.imagen.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.ctvFrontend.puerto }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ctvFrontend.puerto }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ctv-frontend
spec:
  selector:
    app: ctv-frontend
  ports:
    - port: {{ .Values.ctvFrontend.puerto }}
      targetPort: {{ .Values.ctvFrontend.puerto }}
