apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tp-pds
spec:
  ingressClassName: {{ .Values.ingress.claseIngress }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ctv-frontend
                port:
                  number: {{ .Values.ctvFrontend.puerto }}
