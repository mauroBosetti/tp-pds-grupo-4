apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-vuelos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-vuelos
  template:
    metadata:
      labels:
        app: api-vuelos
    spec:
      containers:
        - name: api-vuelos
          image: "{{ .Values.apiVuelos.imagen.repositorio }}:{{ .Values.apiVuelos.imagen.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.apiVuelos.puerto }}
          env:
            - name: PORT
              value: {{ .Values.apiVuelos.puerto | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secretos
                  key: DATABASE_URL_VUELOS
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiVuelos.puerto }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-vuelos
spec:
  selector:
    app: api-vuelos
  ports:
    - port: {{ .Values.apiVuelos.puerto }}
      targetPort: {{ .Values.apiVuelos.puerto }}
