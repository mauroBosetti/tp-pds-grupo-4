{{- if .Values.observabilidad.habilitada }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: {{ .Release.Namespace }}
            action: keep
          - source_labels: [container]
            regex: POD|
            action: drop
          - source_labels: [container]
            target_label: container_label_com_docker_compose_service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        own_namespace = true
      }
    }

    discovery.relabel "servicios" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "ctv-backend|api-vuelos"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }
    }

    loki.source.kubernetes "servicios" {
      targets    = discovery.relabel.servicios.output
      forward_to = [loki.write.destino.receiver]
    }

    loki.write "destino" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yml: |
{{ .Files.Get "files/grafana/datasources.yml" | indent 4 }}
  dashboards.yml: |
{{ .Files.Get "files/grafana/dashboards.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  influx-dashboard.json: |
{{ .Files.Get "files/grafana/dashboards/influx-dashboard.json" | indent 4 }}
  loki-dashboard.json: |
{{ .Files.Get "files/grafana/dashboards/loki-dashboard.json" | indent 4 }}
  prometheus-dashboard.json: |
{{ .Files.Get "files/grafana/dashboards/prometheus-dashboard.json" | indent 4 }}
{{- if .Values.observabilidad.k6.habilitado }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
data:
{{- range $ruta := .Values.observabilidad.k6.scripts }}
  {{ $ruta | replace "/" "__" | quote }}: |
{{ $.Files.Get (printf "files/k6/%s" $ruta) | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
