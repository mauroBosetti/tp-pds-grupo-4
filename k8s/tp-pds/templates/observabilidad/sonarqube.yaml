{{- if .Values.observabilidad.habilitada }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.observabilidad.sonarqube.almacenamiento }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sonarqube
          image: {{ .Values.observabilidad.sonarqube.imagen }}
          env:
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: datos
              mountPath: /opt/sonarqube/data
            - name: datos
              mountPath: /opt/sonarqube/logs
              subPath: logs
            - name: datos
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: sonarqube-data
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
{{- end }}
