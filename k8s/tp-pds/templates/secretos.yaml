apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secretos
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secretos.claveJwt | quote }}
  POSTGRES_PASSWORD_CTV: {{ .Values.secretos.passwordPostgresCtv | quote }}
  POSTGRES_PASSWORD_VUELOS: {{ .Values.secretos.passwordPostgresVuelos | quote }}
  GRAFANA_PASSWORD: {{ .Values.secretos.passwordGrafana | quote }}
  DATABASE_URL_CTV: {{ printf "postgresql://%s:%s@db-ctv:5432/ctv" .Values.postgres.bases.ctv.usuario .Values.secretos.passwordPostgresCtv | quote }}
  DATABASE_URL_VUELOS: {{ printf "postgresql://%s:%s@db-vuelos:5432/vuelos" .Values.postgres.bases.vuelos.usuario .Values.secretos.passwordPostgresVuelos | quote }}
  {{- range $indice, $administrador := .Values.administradores }}
  ADMIN{{ add1 $indice }}_NOMBRE: {{ $administrador.nombre | quote }}
  ADMIN{{ add1 $indice }}_EMAIL: {{ $administrador.email | quote }}
  ADMIN{{ add1 $indice }}_PASSWORD: {{ $administrador.password | quote }}
  {{- end }}
