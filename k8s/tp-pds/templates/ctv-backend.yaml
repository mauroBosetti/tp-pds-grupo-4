apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctv-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctv-backend
  template:
    metadata:
      labels:
        app: ctv-backend
    spec:
      containers:
        - name: ctv-backend
          image: "{{ .Values.ctvBackend.imagen.repositorio }}:{{ .Values.ctvBackend.imagen.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js"]
          ports:
            - containerPort: {{ .Values.ctvBackend.puerto }}
          env:
            - name: PORT
              value: {{ .Values.ctvBackend.puerto | quote }}
            - name: API_VUELOS_URL
              value: "http://api-vuelos:{{ .Values.apiVuelos.puerto }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secretos
                  key: DATABASE_URL_CTV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secretos
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /hola
              port: {{ .Values.ctvBackend.puerto }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ctv-backend
spec:
  selector:
    app: ctv-backend
  ports:
    - port: {{ .Values.ctvBackend.puerto }}
      targetPort: {{ .Values.ctvBackend.puerto }}
