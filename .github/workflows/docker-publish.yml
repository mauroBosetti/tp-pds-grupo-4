name: Publicar imágenes Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: ctv-backend
            contexto: packages/ctv-backend
            argumentos: |
              DATABASE_URL=postgresql://build:build@localhost:5432/build
          - imagen: ctv-frontend
            contexto: packages/ctv-frontend
            argumentos: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generar tags de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.imagen }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          build-args: ${{ matrix.argumentos }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
