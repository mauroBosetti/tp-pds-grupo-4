  sonar:
    name: Sonar Analysis (Temporal)
    runs-on: ubuntu-latest
    #needs: [backend, api-vuelos, frontend]
    env:
      DISABLE_ERD: "true"
      PRISMA_DISABLE_ERD: "true"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vuelos_test
          POSTGRES_PASSWORD: vuelos_test
          POSTGRES_DB: vuelos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w ctv-backend

      - name: Generar coberturas de todos los paquetes
        env:
          TEST_DATABASE_URL: postgresql://vuelos_test:vuelos_test@localhost:5432/vuelos_test
        run: npm run test:coverage

      - name: Esperar a que SonarQube esté listo
        run: |
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            echo "Esperando que el contenedor de SonarQube inicie..."
            sleep 5
          done
          echo "SonarQube iniciado correctamente."
          CHANGE_RES=$(curl -s -X POST "http://localhost:9000/api/users/change_password" \
            -u admin:admin \
            -d "login=admin" \
            -d "previousPassword=admin" \
            -d "password=adminAdmin#123")
          echo "Respuesta cambio contraseña: $CHANGE_RES"
          RESPONSE=$(curl -s -X POST "http://localhost:9000/api/user_tokens/generate?name=ci-token-$(date +%s)" \
            -u "admin:adminAdmin#123")
          echo "Respuesta generación token: $RESPONSE"
          SONAR_TOKEN=$(echo $RESPONSE | jq -r '.token')
          echo "SONAR_GENERATED_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: Configurar condiciones globales en el Quality Gate ("Sonar way")
        run: |
          SONAR_PASS=adminAdmin#123
          # Umbrales del Quality Gate
          MIN_COVERAGE=80                # Cobertura mínima requerida (%)
          MAX_RELIABILITY_RATING=1       # 1 = Rating A (Falla si hay bugs que bajen la nota a B o peor)
          MAX_SECURITY_RATING=1          # 1 = Rating A (Falla si hay vulnerabilidades)
          MAX_SQALE_RATING=1             # 1 = Rating A (Falla si la mantenibilidad/Code Smells caen a B)
          MIN_HOTSPOTS_REVIEWED=100      # % mínimo de Hotspots de seguridad revisados
          MAX_DUPLICATION=3              # % máximo de duplicación de código permitido

          # 1. Crear Quality Gate personalizado
          curl -s -X POST "http://localhost:9000/api/qualitygates/create?name=CIGate" \
            -u "admin:${SONAR_PASS}"

          # 2. Establecer CIGate como predeterminado
          curl -s -X POST "http://localhost:9000/api/qualitygates/set_as_default?name=CIGate" \
            -u "admin:${SONAR_PASS}"

          echo "Configurando condiciones globales en CIGate..."

          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=coverage" -d "op=LT" -d "error=${MIN_COVERAGE}"
          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=reliability_rating" -d "op=GT" -d "error=${MAX_RELIABILITY_RATING}"
          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=security_rating" -d "op=GT" -d "error=${MAX_SECURITY_RATING}"
          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=sqale_rating" -d "op=GT" -d "error=${MAX_SQALE_RATING}"
          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=security_hotspots_reviewed" -d "op=LT" -d "error=${MIN_HOTSPOTS_REVIEWED}"
          curl -s -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -u "admin:${SONAR_PASS}" -d "gateName=CIGate" -d "metric=duplicated_lines_density" -d "op=GT" -d "error=${MAX_DUPLICATION}"

      - name: Ejecutar escaneo en SonarQube
        run: |
          npm run sonar -- \
            -Dsonar.host.url="http://localhost:9000" \
            -Dsonar.token="${{ env.SONAR_GENERATED_TOKEN }}" \
            -Dsonar.qualitygate.wait=true
      
      - name: Generar resumen de SonarQube
        if: always()
        run: |
          QG_STATUS=$(curl -s -u "${{ env.SONAR_GENERATED_TOKEN }}:" "http://localhost:9000/api/qualitygates/project_status?projectKey=tp-pds-grupo-4" | jq -r '.projectStatus.status // "UNKNOWN"')

          MEASURES=$(curl -s -u "${{ env.SONAR_GENERATED_TOKEN }}:" "http://localhost:9000/api/measures/component?component=tp-pds-grupo-4&metricKeys=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,ncloc,sqale_index,security_hotspots")

          COV=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="coverage") | .value // "N/A"')
          BUGS=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="bugs") | .value // "0"')
          VULN=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="vulnerabilities") | .value // "0"')
          SMELLS=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="code_smells") | .value // "0"')
          DUP=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="duplicated_lines_density") | .value // "0"')
          LINES=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="ncloc") | .value // "0"')
          DEBT=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="sqale_index") | .value // "0"')
          HOTSPOTS=$(echo "$MEASURES" | jq -r '.component.measures[]? | select(.metric=="security_hotspots") | .value // "0"')

          if [ "$QG_STATUS" = "OK" ]; then QG_ICON="✅ PASSED"; else QG_ICON="❌ FAILED"; fi

          echo "## 📊 Resumen del Análisis de SonarQube" >> $GITHUB_STEP_SUMMARY
          echo "### Resultado Quality Gate: **${QG_ICON}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 **Cobertura de Código** | **${COV}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐛 **Bugs** | ${BUGS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 **Vulnerabilidades** | ${VULN} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 **Code Smells** | ${SMELLS} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ **Deuda Técnica (Minutos)** | ${DEBT} min |" >> $GITHUB_STEP_SUMMARY
          echo "| 📑 **Duplicación** | ${DUP}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Hotspots de Seguridad** | ${HOTSPOTS} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 **Líneas de Código** | ${LINES} |" >> $GITHUB_STEP_SUMMARY

          cp $GITHUB_STEP_SUMMARY reporte-sonarqube.md

      - name: Subir reporte como artefacto descargable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-sonarqube
          path: reporte-sonarqube.md
          retention-days: 15