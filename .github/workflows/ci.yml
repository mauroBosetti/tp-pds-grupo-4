name: CI

on:
  push:
    branches: [ main, dev, qa/sonar-ci-tmp ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Vitest & Build)
    runs-on: ubuntu-latest
    env:
      DISABLE_ERD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w ctv-backend

      - name: Correr tests unitarios
        run: npm run test -w ctv-backend

      - name: Compilar
        run: npm run build -w ctv-backend

  api-vuelos:
    name: API Vuelos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vuelos_test
          POSTGRES_PASSWORD: vuelos_test
          POSTGRES_DB: vuelos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests BDD con Cucumber
        env:
          TEST_DATABASE_URL: postgresql://vuelos_test:vuelos_test@localhost:5432/vuelos_test
        run: npm run test -w api-vuelos

  frontend:
    name: Frontend (Vitest, Build & Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests unitarios con Vitest
        run: npm run test -w ctv-frontend

      - name: Compilar
        run: npm run build -w ctv-frontend

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chrome
        working-directory: packages/ctv-frontend

      - name: Correr tests E2E con Playwright
        run: npm run test:e2e -w ctv-frontend

      - name: Subir reporte de Playwright (en caso de fallo)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/ctv-frontend/playwright-report/
          retention-days: 7
  
  sonar:
    name: Sonar Analysis (Efímero)
    runs-on: ubuntu-latest
    needs: [backend, api-vuelos, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vuelos_test
          POSTGRES_PASSWORD: vuelos_test
          POSTGRES_DB: vuelos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w ctv-backend

      - name: Generar coberturas de todos los paquetes
        env:
          TEST_DATABASE_URL: postgresql://vuelos_test:vuelos_test@localhost:5432/vuelos_test
        run: npm run test:coverage

      - name: Esperar a que SonarQube esté listo
        run: |
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            echo "Esperando que el contenedor de SonarQube inicie..."
            sleep 5
          done
          echo "SonarQube iniciado correctamente."

      - name: Ejecutar escaneo en SonarQube efímero
        run: |
          npm run sonar -- -Dsonar.host.url="http://localhost:9000" -Dsonar.login="admin" -Dsonar.password="admin"
