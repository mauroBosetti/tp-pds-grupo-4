name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Vitest & Build)
    runs-on: ubuntu-latest
    env:
      DISABLE_ERD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run db:generate -w ctv-backend

      - name: Correr tests unitarios
        run: npm run test -w ctv-backend

      - name: Compilar
        run: npm run build -w ctv-backend

  api-vuelos:
    name: API Vuelos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vuelos_test
          POSTGRES_PASSWORD: vuelos_test
          POSTGRES_DB: vuelos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests BDD con Cucumber
        env:
          TEST_DATABASE_URL: postgresql://vuelos_test:vuelos_test@localhost:5432/vuelos_test
        run: npm run test -w api-vuelos

  frontend:
    name: Frontend (Vitest, Build & Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests unitarios con Vitest
        run: npm run test -w ctv-frontend

      - name: Compilar
        run: npm run build -w ctv-frontend

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chrome
        working-directory: packages/ctv-frontend

      - name: Correr tests E2E con Playwright
        run: npm run test:e2e -w ctv-frontend

      - name: Subir reporte de Playwright (en caso de fallo)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/ctv-frontend/playwright-report/
          retention-days: 7
